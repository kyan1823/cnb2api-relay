# Relay vhost: one fixed public domain that follows the current CNB workspace.
#
# Replace every ai.example.com below (two server blocks) with your domain, and
# keep SERVER_NAME in docker-compose.yml in sync.
#
# TLS material expected at /etc/nginx/ssl/fullchain.pem + privkey.pem
# (mounted from ./nginx/ssl). If absent, the container generates a self-signed
# pair on first boot so it still starts.

# cnb-register.py writes $cnb_ai_upstream as "host:443". TLS SNI and the Host
# header must carry the bare host, so strip the port for those two variables.
map $cnb_ai_upstream $cnb_ai_sni {
    ~^([^:]+):\d+$  $1;
    default         $cnb_ai_upstream;
}

server {
    listen 80;
    server_name ai.example.com;

    # certbot --webroot -w ./certbot (mounted at /var/www/certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.example.com;

    # Must stay above the proxy's own 4 MiB body cap; nginx's 1 MiB default
    # would reject long-context requests here with a bare nginx 413.
    client_max_body_size 8m;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Alpine's nginx.conf already declares a shared zone named SSL; use our own.
    ssl_session_cache shared:cnb_relay:10m;
    ssl_session_timeout 1h;

    # The upstream host is read from the map per request, so nginx resolves it
    # at runtime and needs a resolver. 127.0.0.11 is Docker's embedded DNS.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Self-registration endpoint (workspace -> relay). Local only.
    location = /ops/register {
        proxy_pass http://127.0.0.1:9003/register;
    }

    # Everything else -> current workspace port-proxy (via the map variable).
    location / {
        proxy_pass https://$cnb_ai_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $cnb_ai_sni;
        proxy_set_header Host $cnb_ai_sni;
        proxy_set_header Connection '';
        proxy_buffering off;                    # stream SSE without buffering
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 15s;
    }
}
